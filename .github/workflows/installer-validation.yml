name: Validate desktop installers
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage
          - os: windows-2022
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf libfuse2t64 xdg-utils
      - run: rustup update stable
      - run: rustup default stable
      - run: pnpm install --frozen-lockfile
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: Kanso-${{ runner.os }}-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
          command -v kanso
          xvfb-run -a bash -ec 'kanso & pid=$!; sleep 10; kill -0 "$pid"; kill "$pid"; wait "$pid" || true'
          sudo apt-get remove -y kanso
          xvfb-run -a bash -ec '"$1" --appimage-extract-and-run & pid=$!; sleep 15; kill -0 "$pid"; kill "$pid"; wait "$pid" || true' _ src-tauri/target/release/bundle/appimage/*.AppImage
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          $msi = (Get-Item "$bundle/msi/*.msi").FullName
          function Test-InstalledWindow($root) {
            $app = Get-ChildItem $root -Recurse -Filter kanso.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (!$app) { throw "Installed executable missing under $root" }
            $process = Start-Process $app.FullName -PassThru
            try {
              for ($i = 0; $i -lt 60; $i++) {
                $process.Refresh()
                if ($process.HasExited) { throw "Kanso exited during startup" }
                if ($process.MainWindowHandle -ne 0) { return }
                Start-Sleep -Milliseconds 500
              }
              throw "No application window appeared"
            } finally {
              if (!$process.HasExited) {
                $null = $process.CloseMainWindow()
                if (!$process.WaitForExit(10000)) { $process.Kill(); throw "Window failed to close" }
              }
            }
          }
          foreach ($argsList in @("/i `"$msi`" /qn /norestart", "/x `"$msi`" /qn /norestart")) {
            $process = Start-Process msiexec -ArgumentList $argsList -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "MSI returned $($process.ExitCode)" }
            if ($argsList.StartsWith("/i")) { Test-InstalledWindow "$env:ProgramFiles/Kanso" }
          }
          $exe = (Get-Item "$bundle/nsis/*.exe").FullName
          $process = Start-Process $exe -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS returned $($process.ExitCode)" }
          Test-InstalledWindow "$env:LOCALAPPDATA/Kanso"
          $uninstaller = Get-Item "$env:LOCALAPPDATA/Kanso/uninstall.exe"
          $process = Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS uninstall returned $($process.ExitCode)" }
